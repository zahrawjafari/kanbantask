<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Task</title>
</head>

<body class="min-h-screen bg-[#f4f7fd] text-[#2b2c37] dark:bg-[#20212c] dark:text-white">

  <!-- APP -->
  <div id="app" class="min-h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed left-0 top-0 z-30 flex h-screen w-[260px] flex-col border-r border-[#e4ebfa] bg-white transition-transform duration-300 dark:border-[#3e3f4e] dark:bg-[#2b2c37]">

      <!-- LOGO -->
      <div class="px-6 py-6">
        <img src="/img/logo-light-4fb0dd87.svg" alt="Kanban Logo" class="w-[150px]" />
      </div>

      <!-- BOARDS -->
      <div class="flex-1 overflow-y-auto">

        <p id="boards-count" class="mb-4 px-6 text-xs font-bold uppercase tracking-widest text-[#828fa3]">
          All Boards (4)
        </p>

        <nav id="boards-nav" class="space-y-1">

          <button id="board-1" type="button" class="board-button flex h-12 w-[231px] items-center gap-3 rounded-r-2xl bg-[#635fc7] px-6 text-left text-white">
            <span>▰</span>
            <span>Platform Launch</span>
          </button>

          <button id="board-2" type="button" class="board-button flex h-12 w-[231px] items-center gap-3 rounded-r-2xl px-6 text-left text-[#828fa3] hover:bg-[#f0effa] hover:text-[#635fc7] dark:hover:bg-[#3e3f4e]">
            <span>▰</span>
            <span>Marketing Plan</span>
          </button>

          <button id="board-3" type="button" class="board-button flex h-12 w-[231px] items-center gap-3 rounded-r-2xl px-6 text-left text-[#828fa3] hover:bg-[#f0effa] hover:text-[#635fc7] dark:hover:bg-[#3e3f4e]">
            <span>▰</span>
            <span>Roadmap</span>
          </button>

          <button id="board-4" type="button" class="board-button flex h-12 w-[231px] items-center gap-3 rounded-r-2xl px-6 text-left text-[#828fa3] hover:bg-[#f0effa] hover:text-[#635fc7] dark:hover:bg-[#3e3f4e]">
            <span>▰</span>
            <span>Website Design</span>
          </button>

        </nav>

        <!-- CREATE BOARD -->
        <button id="create-board" type="button" class="mt-3 flex h-12 w-[231px] items-center gap-3 rounded-r-2xl px-6 text-left text-[#635fc7] hover:bg-[#f0effa] dark:hover:bg-[#3e3f4e]">
          <span class="text-xl">+</span>
          <span>Create New Board</span>
        </button>

      </div>

      <!-- BOTTOM SIDEBAR -->
      <div class="px-4 pb-6">

        <!-- THEME -->
        <div class="mb-3 flex items-center justify-center gap-4 rounded-lg bg-[#f4f7fd] p-3 dark:bg-[#20212c]">
          <span>☀️</span>

          <button id="theme-toggle" type="button" class="relative h-6 w-12 rounded-full bg-[#635fc7]">
            <span id="theme-toggle-dot" class="absolute left-1 top-1 h-4 w-4 rounded-full bg-white transition-all"></span>
          </button>

          <span>🌙</span>
        </div>

        <!-- HIDE SIDEBAR -->
        <button id="hide-sidebar" type="button" class="flex w-full items-center gap-3 rounded-r-2xl px-4 py-3 text-sm font-bold text-[#828fa3] hover:bg-[#f0effa] hover:text-[#635fc7] dark:hover:bg-[#3e3f4e]">
          <span>◀</span>
          <span>Hide Sidebar</span>
        </button>

      </div>

    </aside>

    <!-- SHOW SIDEBAR -->
    <button id="show-sidebar" type="button" class="fixed bottom-8 left-0 z-40 hidden h-12 w-14 items-center justify-center rounded-r-full bg-[#635fc7] text-xl text-white shadow-lg">
      ▶
    </button>


    <!-- MAIN -->
    <main id="main-content" class="min-h-screen pl-[260px] transition-all duration-300">

      <!-- HEADER -->
      <header class="flex h-[80px] items-center justify-between border-b border-[#e4ebfa] bg-white px-6 dark:border-[#3e3f4e] dark:bg-[#2b2c37]">

        <h1 id="board-title" class="text-2xl font-bold">
          Platform Launch
        </h1>

        <div class="flex items-center gap-4">

          <button id="add-task" type="button" class="flex h-12 items-center justify-center rounded-3xl bg-[#635fc7] px-6 font-bold text-white hover:bg-[#7a77d8]">
            <span class="mr-2 text-xl">+</span>
            <span>Add New Task</span>
          </button>

          <!-- BOARD MENU -->
          <button id="board-menu-button" type="button" class="flex h-10 w-10 items-center justify-center text-2xl font-bold text-[#828fa3] hover:text-[#635fc7]">
            ⋮
          </button>

          <div id="board-menu" class="absolute right-6 top-[65px] z-50 hidden w-[180px] rounded-lg bg-white p-2 shadow-xl dark:bg-[#2b2c37]">

            <button id="edit-board" type="button" class="w-full rounded-md px-4 py-3 text-left text-sm text-[#828fa3] hover:bg-[#f4f7fd] hover:text-[#635fc7] dark:hover:bg-[#20212c]">
              Edit Board
            </button>

            <button id="delete-board" type="button" class="w-full rounded-md px-4 py-3 text-left text-sm text-[#ea5555] hover:bg-[#fff0f0] dark:hover:bg-[#20212c]">
              Delete Board
            </button>

          </div>

        </div>

      </header>


      <!-- BOARD -->
      <section id="board-container" class="flex min-h-[calc(100vh-80px)] gap-6 overflow-x-auto bg-[#f4f7fd] p-6 dark:bg-[#20212c]">

        <!-- TODO -->
        <div class="min-w-[280px] w-[280px]">

          <div class="mb-6 flex items-center gap-3">
            <span class="h-4 w-4 rounded-full bg-[#49c4e5]"></span>

            <h2 class="text-xs font-bold tracking-[2px] text-[#828fa3]">
              TODO
            </h2>

            <span id="todo-count" class="text-xs font-bold text-[#828fa3]">
              (0)
            </span>
          </div>

          <div id="todo-list" class="space-y-4"></div>

        </div>


        <!-- DOING -->
        <div class="min-w-[280px] w-[280px]">

          <div class="mb-6 flex items-center gap-3">
            <span class="h-4 w-4 rounded-full bg-[#8471f2]"></span>

            <h2 class="text-xs font-bold tracking-[2px] text-[#828fa3]">
              DOING
            </h2>

            <span id="doing-count" class="text-xs font-bold text-[#828fa3]">
              (0)
            </span>
          </div>

          <div id="doing-list" class="space-y-4"></div>

        </div>


        <!-- DONE -->
        <div class="min-w-[280px] w-[280px]">

          <div class="mb-6 flex items-center gap-3">
            <span class="h-4 w-4 rounded-full bg-[#67e2ae]"></span>

            <h2 class="text-xs font-bold tracking-[2px] text-[#828fa3]">
              DONE
            </h2>

            <span id="done-count" class="text-xs font-bold text-[#828fa3]">
              (0)
            </span>
          </div>

          <div id="done-list" class="space-y-4"></div>

        </div>


        <!-- NEW COLUMN -->
        <button id="new-column" type="button" class="mt-10 flex h-[calc(100vh-180px)] min-w-[280px] items-center justify-center rounded-lg bg-[#e9effa] text-xl font-bold text-[#828fa3] hover:text-[#635fc7] dark:bg-[#2b2c37]">
          + New Column
        </button>

      </section>

    </main>

  </div>


  <!-- TASK DETAILS MODAL -->
  <div id="task-details" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/50 px-4">

    <div class="relative w-full max-w-[500px] rounded-lg bg-white p-8 shadow-xl dark:bg-[#2b2c37]">

      <!-- HEADER -->
      <div class="mb-6 flex items-start justify-between">

        <h2 id="details-title" class="max-w-[380px] text-xl font-bold">
          Task Details
        </h2>

        <div class="relative">

          <button id="task-menu-button" type="button" class="flex h-8 w-8 items-center justify-center text-2xl font-bold text-[#828fa3]">
            ⋮
          </button>

          <!-- TASK MENU -->
          <div id="task-menu" class="absolute right-0 top-9 z-50 hidden w-[160px] rounded-lg bg-white p-2 shadow-xl dark:bg-[#2b2c37]">

            <button id="edit-task" type="button" class="w-full rounded-md px-4 py-3 text-left text-sm text-[#828fa3] hover:bg-[#f4f7fd] hover:text-[#635fc7] dark:hover:bg-[#20212c]">
              Edit Task
            </button>

            <button id="delete-task" type="button" class="w-full rounded-md px-4 py-3 text-left text-sm text-[#ea5555] hover:bg-[#fff0f0] dark:hover:bg-[#20212c]">
              Delete Task
            </button>

          </div>

        </div>

      </div>


      <!-- DESCRIPTION -->
      <p id="details-description" class="mb-6 text-sm leading-6 text-[#828fa3]"></p>


      <!-- STATUS -->
      <div class="mb-6">

        <label class="mb-2 block text-xs font-bold text-[#828fa3]">
          Current Status
        </label>

        <select id="details-status" class="w-full rounded-md border border-[#e4ebfa] bg-white p-3 text-sm outline-none focus:border-[#635fc7] dark:border-[#3e3f4e] dark:bg-[#20212c] dark:text-white">

          <option value="todo">Todo</option>
          <option value="doing">Doing</option>
          <option value="done">Done</option>

        </select>

      </div>


      <!-- SUBTASKS -->
      <div>

        <p class="mb-3 text-xs font-bold text-[#828fa3]">
          Subtasks
        </p>

        <div id="details-subtasks" class="space-y-2"></div>

      </div>


      <!-- CLOSE -->
      <button id="close-details" type="button" class="mt-6 w-full rounded-2xl bg-[#f0effa] py-3 font-bold text-[#635fc7] dark:bg-[#20212c]">
        Close
      </button>

    </div>

  </div>


  <!-- DELETE CONFIRM MODAL -->
  <div id="delete-modal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/50 px-4">

    <div class="w-full max-w-[450px] rounded-lg bg-white p-8 shadow-2xl dark:bg-[#2b2c37]">

      <h2 class="mb-4 text-xl font-bold text-[#ea5555]">
        Delete Task
      </h2>

      <p id="delete-message" class="mb-8 text-sm leading-6 text-[#828fa3]">
        Are you sure you want to delete this task?
      </p>

      <div class="flex gap-3">

        <button id="confirm-delete" type="button" class="flex-1 rounded-2xl bg-[#ea5555] py-3 font-bold text-white hover:bg-[#ff6b6b]">
          Delete
        </button>

        <button id="cancel-delete" type="button" class="flex-1 rounded-2xl bg-[#f0effa] py-3 font-bold text-[#635fc7] dark:bg-[#20212c]">
          Cancel
        </button>

      </div>

    </div>

  </div>


  <!-- ADD / EDIT TASK MODAL -->
  <div id="task-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4">

    <div class="w-full max-w-[480px] max-h-[90vh] overflow-y-auto rounded-lg bg-white p-8 shadow-xl dark:bg-[#2b2c37]">

      <div class="mb-6 flex items-center justify-between">

        <h2 id="task-modal-title" class="text-xl font-bold">
          Add New Task
        </h2>

        <button id="close-modal" type="button" class="text-2xl font-bold text-[#828fa3] hover:text-[#635fc7]">
          ×
        </button>

      </div>


      <form id="task-form" class="space-y-5">

        <!-- TITLE -->
        <div>

          <label for="task-title" class="mb-2 block text-xs font-bold text-[#828fa3]">
            Title
          </label>

          <input id="task-title" type="text" required placeholder="e.g. Build UI" class="w-full rounded-md border border-[#e4ebfa] bg-white p-3 text-sm outline-none focus:border-[#635fc7] dark:border-[#3e3f4e] dark:bg-[#20212c] dark:text-white" />

        </div>


        <!-- DESCRIPTION -->
        <div>

          <label for="task-description" class="mb-2 block text-xs font-bold text-[#828fa3]">
            Description
          </label>

          <textarea id="task-description" rows="4" placeholder="Add task description..." class="w-full resize-none rounded-md border border-[#e4ebfa] bg-white p-3 text-sm outline-none focus:border-[#635fc7] dark:border-[#3e3f4e] dark:bg-[#20212c] dark:text-white"></textarea>

        </div>


        <!-- STATUS -->
        <div>

          <label for="task-status" class="mb-2 block text-xs font-bold text-[#828fa3]">
            Status
          </label>

          <select id="task-status" class="w-full rounded-md border border-[#e4ebfa] bg-white p-3 text-sm outline-none focus:border-[#635fc7] dark:border-[#3e3f4e] dark:bg-[#20212c] dark:text-white">

            <option value="todo">Todo</option>
            <option value="doing">Doing</option>
            <option value="done">Done</option>

          </select>

        </div>


        <!-- SUBTASKS -->
        <div>

          <label class="mb-2 block text-xs font-bold text-[#828fa3]">
            Subtasks
          </label>

          <div id="subtask-container" class="space-y-3"></div>

          <button id="add-subtask" type="button" class="mt-3 w-full rounded-2xl bg-[#f0effa] py-3 font-bold text-[#635fc7] dark:bg-[#20212c]">
            + Add New Subtask
          </button>

        </div>


        <button id="submit-task" type="submit" class="w-full rounded-2xl bg-[#635fc7] py-3 font-bold text-white hover:bg-[#7a77d8]">
          Create Task
        </button>

      </form>

    </div>

  </div>


  <!-- CREATE BOARD MODAL -->
  <div id="board-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4">

    <div class="w-full max-w-[450px] rounded-lg bg-white p-8 shadow-xl dark:bg-[#2b2c37]">

      <div class="mb-6 flex items-center justify-between">

        <h2 class="text-xl font-bold">
          Create New Board
        </h2>

        <button id="close-board-modal" type="button" class="text-2xl font-bold text-[#828fa3]">
          ×
        </button>

      </div>

      <form id="board-form" class="space-y-5">

        <div>

          <label for="board-name" class="mb-2 block text-xs font-bold text-[#828fa3]">
            Board Name
          </label>

          <input id="board-name" type="text" required placeholder="e.g. Website Design" class="w-full rounded-md border border-[#e4ebfa] bg-white p-3 text-sm outline-none focus:border-[#635fc7] dark:border-[#3e3f4e] dark:bg-[#20212c] dark:text-white" />

        </div>

        <button type="submit" class="w-full rounded-2xl bg-[#635fc7] py-3 font-bold text-white">
          Create Board
        </button>

      </form>

    </div>

  </div>


  <!-- NEW COLUMN MODAL -->
  <div id="column-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4">

    <div class="w-full max-w-[450px] rounded-lg bg-white p-8 shadow-xl dark:bg-[#2b2c37]">
      <div class="mb-6 flex items-center justify-between">
        <h2 class="text-xl font-bold">
          New Column
        </h2>
        <button id="close-column-modal" type="button" class="text-2xl font-bold text-[#828fa3]">
          ×
        </button>
      </div>
      <form id="column-form" class="space-y-5">
        <div>
          <label for="column-name" class="mb-2 block text-xs font-bold text-[#828fa3]">
            Column Name
          </label>
          <input id="column-name" type="text" required placeholder="e.g. Review" class="w-full rounded-md border border-[#e4ebfa] bg-white p-3 text-sm outline-none focus:border-[#635fc7] dark:border-[#3e3f4e] dark:bg-[#20212c] dark:text-white" />
        </div>
        <button type="submit" class="w-full rounded-2xl bg-[#635fc7] py-3 font-bold text-white">
          Create Column
        </button>
      </form>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
